name: statushd
description: A customizable media preparation and sharing app for WhatsApp Status.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  file_picker: ^10.3.8
  media_kit: ^1.2.3
  media_kit_video: ^1.3.0
  media_kit_libs_video: ^1.0.6
  share_plus: ^10.1.4
  shared_preferences: ^2.3.3
  video_player: ^2.9.2
  v_video_compressor: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
