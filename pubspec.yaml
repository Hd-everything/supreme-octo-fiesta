name: statushd
description: Vyntra — Video Editor & AI Studio for on-device video editing.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.8
  media_kit: ^1.2.3
  media_kit_video: ^1.3.0
  media_kit_libs_video: ^1.0.6
  share_plus: ^10.1.4
  shared_preferences: ^2.3.3
  video_player: ^2.9.2
  crypto: ^3.0.7
  path: ^1.9.1
  supabase_flutter: ^2.10.3
  tflite_flutter: ^0.12.1
  image: ^4.5.4
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon.png
  adaptive_icon_background: "#050706"
  adaptive_icon_foreground: assets/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/models/espcn_x3.tflite
    - assets/models/espcn_quant_x3.tflite
    - assets/models/model_manifest.json
