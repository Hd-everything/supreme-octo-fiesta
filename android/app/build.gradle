plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android'; id 'dev.flutter.flutter-gradle-plugin' }

android { namespace 'com.ptip.statushd'; compileSdk 36
    ndkVersion "28.2.13676358"
    defaultConfig { applicationId 'com.ptip.statushd'; minSdk 24; targetSdk 35; versionCode 1; versionName '1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.media3:media3-common:1.5.1'
    implementation 'androidx.media3:media3-effect:1.5.1'
    implementation 'androidx.media3:media3-transformer:1.5.1'
    // The Flutter tflite_flutter plugin supplies the LiteRT runtime. Depend on
    // its API artifact here so the native video bridge does not package a
    // second copy of libtensorflowlite_jni.so.
    implementation 'com.google.ai.edge.litert:litert-api:1.4.0'
}
