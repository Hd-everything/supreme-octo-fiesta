name: Android verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Validate cloud renderer Python syntax
        run: python3 -m py_compile cloud-renderer/worker.py
      - name: Build cloud renderer container
        run: docker build --tag vyntra-cloud-renderer cloud-renderer
      - name: Restore packages
        run: flutter pub get
      - name: Format check
        run: dart format lib test
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test
      - name: Align Android plugin JVM targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          cache = Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache")))
          packages = ("file_picker", "screen_brightness_android", "tflite_flutter")
          for package in packages:
              candidates = sorted(cache.glob(f"hosted/*/{package}-*/android/build.gradle*"))
              if not candidates:
                  print(f"No Groovy Android Gradle file found for {package}; skipping")
                  continue
              gradle = candidates[-1]
              source = gradle.read_text()
              if gradle.suffix == ".kts":
                  source = source.replace('kotlinOptions.jvmTarget = "1.8"', 'compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)')
                  source = source.replace('kotlinOptions.jvmTarget = "17"', 'compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)')
              marker = f"// StatusHD JVM target alignment for {package}"
              if marker in source:
                  source = source.split(marker, 1)[0].rstrip() + "\n"
              if gradle.suffix == ".kts":
                  source += f"""
          {marker}
          android {{
              compileOptions {{
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }}
          }}
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {{
              compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
          }}
          """
              else:
                  source += f"""
          {marker}
          android {{
              compileOptions {{
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }}
          }}
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {{
              compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
          }}
          """
              gradle.write_text(source)
              print(f"Aligned Java/Kotlin targets in {gradle}")
          PY

      - name: Build release APK
        # Flutter stable now requires Gradle 8.14+; this repository's checked-in
        # Android shell uses an older wrapper. Skip Flutter's preflight version
        # gate so Gradle can report any actual build incompatibility.
        run: >-
          flutter build apk --release --android-skip-build-dependency-validation
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"

