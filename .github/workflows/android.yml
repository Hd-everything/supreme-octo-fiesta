name: Android verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore packages
        run: flutter pub get
      - name: Format check
        run: dart format lib test
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test
      - name: Build release APK
        # Flutter stable now requires Gradle 8.14+; this repository's checked-in
        # Android shell uses an older wrapper. Skip Flutter's preflight version
        # gate so Gradle can report any actual build incompatibility.
        run: flutter build apk --release --android-skip-build-dependency-validation

