name: Android verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore packages
        run: flutter pub get
      - name: Format check
        run: dart format lib test
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test
      - name: Align file_picker JVM targets
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          cache = Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache")))
          candidates = sorted(cache.glob("hosted/*/file_picker-*/android/build.gradle*"))
          if not candidates:
              raise SystemExit("Could not locate resolved file_picker Android Gradle project")
          gradle = candidates[-1]
          source = gradle.read_text()
          marker = "// StatusHD file_picker JVM target alignment"
          if marker not in source:
              source += f'''\n\n{marker}\nafterEvaluate {{\n    tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {{\n        sourceCompatibility = "17"\n        targetCompatibility = "17"\n        options.release.set(17)\n    }}\n    tasks.matching {{ it.class.name.contains("KotlinCompile") }}.configureEach {{ task ->\n        try {{ task.kotlinOptions.jvmTarget = "17" }} catch (Exception ignored) {{}}\n    }}\n}}\n'''
              gradle.write_text(source)
          print(f"Aligned file_picker Java/Kotlin targets in {gradle}")
          PY

      - name: Build release APK
        # Flutter stable now requires Gradle 8.14+; this repository's checked-in
        # Android shell uses an older wrapper. Skip Flutter's preflight version
        # gate so Gradle can report any actual build incompatibility.
        run: flutter build apk --release --android-skip-build-dependency-validation

