name: AI model inference smoke

on:
  workflow_dispatch:
    inputs:
      model:
        description: Real model to load and run against a generated six-frame clip
        required: true
        type: choice
        options:
          - espcn
          - edsr
          - swinir
          - realesrgan
          - vrt
          - basicvsr

permissions:
  contents: read

jobs:
  inference:
    name: CPU inference smoke (${{ inputs.model }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout worker
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install FFmpeg and Python prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          python3 -m venv /tmp/vyntra-venv
          /tmp/vyntra-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -r cloud-renderer/requirements.txt

      - name: Run real model inference and verify MP4
        env:
          MODEL: ${{ inputs.model }}
        shell: bash
        run: |
          set -euo pipefail
          /tmp/vyntra-venv/bin/python -u cloud-renderer/smoke_ai_model.py "$MODEL"
