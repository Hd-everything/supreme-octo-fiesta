name: Build Status HD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-hd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Reclaim runner disk space
        run: |
          set -euxo pipefail
          df -h /
          # Remove preinstalled toolchains and Android emulator images not used by this build.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/powershell
          sudo rm -rf "${ANDROID_HOME}/system-images" "${ANDROID_HOME}/emulator"
          # The build installs and uses one pinned NDK version below.
          sudo rm -rf "${ANDROID_HOME}/ndk"
          df -h /

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.ptip --project-name statushd /tmp/statushd

      - name: Add video library permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("/tmp/statushd/android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permissions = [
              '    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />',
              '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
          ]
          for permission in permissions:
              name = permission.split('"')[1]
              if name not in source:
                  source = source.replace("<application", permission + "\n    <application", 1)
          manifest.write_text(source)
          PY
      - name: Set Android compile SDK for current plugins
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("/tmp/statushd/android/app/build.gradle.kts")
          if gradle.exists():
              source = gradle.read_text()
              updated, count = re.subn(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 36", source, count=1)
              if count == 0:
                  updated, count = re.subn(r"compileSdk\s*=\s*\d+", "compileSdk = 36", source, count=1)
              if count == 0:
                  raise SystemExit("Could not set compileSdk in generated Kotlin Gradle file")
              gradle.write_text(updated)
          else:
              gradle = Path("/tmp/statushd/android/app/build.gradle")
              source = gradle.read_text()
              updated, count = re.subn(r"compileSdkVersion\s+flutter\.compileSdkVersion", "compileSdkVersion 36", source, count=1)
              if count == 0:
                  updated, count = re.subn(r"compileSdkVersion\s+\d+", "compileSdkVersion 36", source, count=1)
              if count == 0:
                  raise SystemExit("Could not set compileSdk in generated Gradle file")
              gradle.write_text(updated)
          PY

      - name: Align generated Android NDK with installed toolchain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("/tmp/statushd/android/app")
          candidates = [root / "build.gradle.kts", root / "build.gradle"]
          gradle = next((path for path in candidates if path.exists()), None)
          if gradle is None:
              raise SystemExit("Generated Android app Gradle file was not found")
          source = gradle.read_text()
          if gradle.suffix == ".kts":
              updated, count = re.subn(
                  r'ndkVersion\s*=\s*(?:flutter\.ndkVersion|"[^"]+"|\d+(?:\.\d+)+)',
                  'ndkVersion = "28.2.13676358"',
                  source,
                  count=1,
              )
          else:
              updated, count = re.subn(
                  r'ndkVersion\s+(?:flutter\.ndkVersion|"[^"]+"|\d+(?:\.\d+)+)',
                  'ndkVersion "28.2.13676358"',
                  source,
                  count=1,
              )
          if count == 0:
              raise SystemExit("Could not pin NDK version in generated Gradle file")
          gradle.write_text(updated)
          print(f"Pinned NDK in {gradle} to 28.2.13676358")
          PY

      - name: Add Media3 video processing dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("/tmp/statushd/android/app")
          gradle = next((p for p in (root / "build.gradle.kts", root / "build.gradle") if p.exists()), None)
          if gradle is None:
              raise SystemExit("Generated Android app Gradle file was not found")
          source = gradle.read_text()
          dependencies = (
              ("androidx.media3:media3-transformer", "androidx.media3:media3-effect")
          )
          if not all(dep in source for dep in dependencies):
              if gradle.suffix == ".kts":
                  lines = '\n    implementation("androidx.media3:media3-transformer:1.5.1")\n    implementation("androidx.media3:media3-effect:1.5.1")\n'
                  pattern = r"dependencies\s*\{"
              else:
                  lines = '\n    implementation "androidx.media3:media3-transformer:1.5.1"\n    implementation "androidx.media3:media3-effect:1.5.1"\n'
                  pattern = r"dependencies\s*\{"
              match = re.search(pattern, source)
              if match:
                  source = source[:match.end()] + lines + source[match.end():]
              else:
                  source += "\ndependencies {\n" + lines + "\n}\n"
              gradle.write_text(source)
          print(f"Media3 dependencies verified in {gradle}")
          PY

      - name: Install Android NDK with retry
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          NDK_VERSION="28.2.13676358"
          for attempt in 1 2 3; do
            echo "Installing Android NDK ${NDK_VERSION} (attempt ${attempt}/3)"
            if "${SDKMANAGER}" --install "ndk;${NDK_VERSION}" --sdk_root="${ANDROID_HOME}"; then
              test -f "${ANDROID_HOME}/ndk/${NDK_VERSION}/source.properties"
              exit 0
            fi
            echo "NDK install failed; removing incomplete package before retry."
            rm -rf "${ANDROID_HOME}/ndk/${NDK_VERSION}"
            sleep $((attempt * 10))
          done
          echo "::error::Android NDK installation failed after 3 attempts."
          exit 1

      - name: Copy app source into generated project
        run: |
          rm -rf /tmp/statushd/lib /tmp/statushd/test
          cp -R lib test /tmp/statushd/
          cp pubspec.yaml analysis_options.yaml /tmp/statushd/
          mkdir -p /tmp/statushd/android/app/src/main/kotlin/com/ptip/statushd
          cp android/MainActivity.kt /tmp/statushd/android/app/src/main/kotlin/com/ptip/statushd/MainActivity.kt

      - name: Resolve dependencies
        working-directory: /tmp/statushd
        run: flutter pub get

      - name: Analyze Dart source
        working-directory: /tmp/statushd
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: /tmp/statushd
        run: flutter test

      - name: Build debug APK
        working-directory: /tmp/statushd
        run: flutter build apk --debug

      - name: Upload Android APK
        uses: actions/upload-artifact@v5
        with:
          name: statushd-android-debug
          path: /tmp/statushd/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
