name: Build Vyntra

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: statushd-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build signed Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.ptip --project-name statushd /tmp/statushd
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("/tmp/statushd/android")
          settings = root / "settings.gradle"
          if not settings.exists():
              settings = root / "settings.gradle.kts"
          if settings.exists():
              text = settings.read_text()
              text = text.replace("RepositoriesMode.FAIL_ON_PROJECT_REPOS", "RepositoriesMode.PREFER_PROJECT")
              lines = text.splitlines()
              for i, line in enumerate(lines):
                  if "org.jetbrains.kotlin.android" in line and "version" in line:
                      prefix = line[:line.index("version")]
                      if "id '" in line:
                          lines[i] = prefix + "version '2.3.0' apply false"
                      else:
                          lines[i] = prefix + 'version "2.3.0" apply false'
              text = "\n".join(lines) + "\n"
              settings.write_text(text)

          app = root / "app"
          gradle = next((p for p in (app / "build.gradle.kts", app / "build.gradle") if p.exists()), None)
          if gradle is None:
              raise SystemExit("Generated Android app Gradle file not found")
          text = gradle.read_text()
          if gradle.suffix == ".kts":
              text, n1 = re.subn(r"compileSdk\s*=\s*(?:flutter\.compileSdkVersion|\d+)", "compileSdk = 36", text, count=1)
              text, n2 = re.subn(r'ndkVersion\s*=\s*(?:flutter\.ndkVersion|"[^"]+"|\d+(?:\.\d+)+)', 'ndkVersion = "28.2.13676358"', text, count=1)
              deps = """
              implementation("androidx.media3:media3-transformer:1.11.1")
              implementation("androidx.media3:media3-effect:1.11.1")
              implementation("com.google.ai.edge.litert:litert-api:1.4.0")
              """
          else:
              text, n1 = re.subn(r"compileSdkVersion\s+(?:flutter\.compileSdkVersion|\d+)", "compileSdkVersion 36", text, count=1)
              text, n2 = re.subn(r'ndkVersion\s+(?:flutter\.ndkVersion|"[^"]+"|\d+(?:\.\d+)+)', 'ndkVersion "28.2.13676358"', text, count=1)
              deps = """
              implementation "androidx.media3:media3-transformer:1.11.1"
              implementation "androidx.media3:media3-effect:1.11.1"
              implementation "com.google.ai.edge.litert:litert-api:1.4.0"
              """
          if not n1:
              raise SystemExit("Could not set Android compile SDK")
          if not n2:
              raise SystemExit("Could not set Android NDK version")
          if "androidx.media3:media3-transformer" not in text:
              text, n = re.subn(r"dependencies\s*\{", lambda m: m.group(0) + deps, text, count=1)
              if not n:
                  text += "\ndependencies {\n" + deps + "\n}\n"
          gradle.write_text(text)

          manifest = app / "src/main/AndroidManifest.xml"
          text = manifest.read_text()
          if re.search(r'<application\b[^>]*\bandroid:label="[^"]*"', text):
              text = re.sub(r'(<application\b[^>]*\bandroid:label=")[^"]*"', r'\1Vyntra"', text, count=1)
          else:
              text = re.sub(r'(<application\b)', r'\1 android:label="Vyntra"', text, count=1)
          if "xmlns:tools=" not in text:
              text = text.replace(
                  'xmlns:android="http://schemas.android.com/apk/res/android"',
                  'xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"',
                  1,
              )
          permissions = [
              '<uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />',
              '<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />',
          ]
          for permission in permissions:
              if permission.split('"')[1] not in text:
                  text = text.replace("<application", permission + "\n    <application", 1)
          ads = '<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-8529698532324480~6965542136" />'
          if "com.google.android.gms.ads.APPLICATION_ID" not in text:
              match = re.search(r"<application\b([^>]*)>", text)
              if not match:
                  raise SystemExit("Generated application manifest tag not found")
              text = text[:match.start()] + f"<application{match.group(1)}>\n{ads}" + text[match.end():]
          provider = """        <provider
              android:name="androidx.startup.InitializationProvider"
              android:authorities="${applicationId}.androidx-startup"
              android:exported="false"
              tools:node="merge">
              <meta-data android:name="androidx.work.WorkManagerInitializer" tools:node="remove" />
          </provider>"""
          if "androidx.work.WorkManagerInitializer" not in text:
              text = text.replace("</application>", provider + "\n    </application>", 1)
          manifest.write_text(text)
          PY

          printf '\nkotlin.jvm.target.validation.mode=warning\norg.gradle.vfs.watch=false\norg.gradle.daemon=false\n' >> /tmp/statushd/gradle.properties

      - name: Copy Vyntra sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/statushd/lib /tmp/statushd/test
          cp -R lib test /tmp/statushd/
          cp -R assets /tmp/statushd/
          cp pubspec.yaml analysis_options.yaml /tmp/statushd/
          mkdir -p /tmp/statushd/android/app/src/main/kotlin/com/ptip/statushd
          for file in MainActivity.kt SuperResolutionEngine.kt NeuralFrameProcessor.kt NeuralVideoFrameLoop.kt NeuralVideoEncoder.kt NeuralAudioMuxer.kt NeuralVideoProcessor.kt; do
            test -f "android/app/src/main/kotlin/com/ptip/statushd/$file"
            cp "android/app/src/main/kotlin/com/ptip/statushd/$file" "/tmp/statushd/android/app/src/main/kotlin/com/ptip/statushd/$file"
          done

      - name: Resolve Flutter dependencies
        working-directory: /tmp/statushd
        run: flutter pub get

      - name: Align plugin JVM targets
        working-directory: /tmp/statushd
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          cache = Path(os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache")))
          for package in ("file_picker", "tflite_flutter", "screen_brightness_android"):
              candidates = sorted(cache.glob(f"hosted/*/{package}-*/android/build.gradle*"))
              if not candidates:
                  continue
              gradle = candidates[-1]
              source = gradle.read_text()
              if gradle.suffix == ".kts":
                  source = source.replace('kotlinOptions.jvmTarget = "1.8"', 'compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)')
                  source = source.replace('kotlinOptions.jvmTarget = "17"', 'compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)')
              marker = f"// StatusHD JVM target alignment for {package}"
              if marker in source:
                  source = source.split(marker, 1)[0].rstrip() + "\n"
              if gradle.suffix == ".kts":
                  source += f"""
          {marker}
          android {{
              compileOptions {{
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }}
          }}
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {{
              compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
          }}
          """
              else:
                  source += f"""
          {marker}
          android {{
              compileOptions {{
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }}
          }}
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {{
              compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
          }}
          """
              gradle.write_text(source)
              print(f"Aligned Java/Kotlin targets: {gradle}")
          PY

      - name: Generate launcher icons
        working-directory: /tmp/statushd
        run: dart run flutter_launcher_icons

      - name: Analyze and test
        working-directory: /tmp/statushd
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Configure release signing
        working-directory: /tmp/statushd
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Required repository secret $key is missing"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          test -s android/app/release.keystore
          chmod 600 android/app/release.keystore
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.keystore
          EOF
          chmod 600 android/key.properties
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = next(p for p in (Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")) if p.exists())
          source = gradle.read_text()
          if gradle.suffix == ".kts":
              setup = '''import java.util.Properties
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) keystoreProperties.load(keystorePropertiesFile.inputStream())
          '''
              signing = '''signingConfigs {
              create("release") {
                  keyAlias = keystoreProperties["keyAlias"] as String
                  keyPassword = keystoreProperties["keyPassword"] as String
                  storeFile = file(keystoreProperties["storeFile"] as String)
                  storePassword = keystoreProperties["storePassword"] as String
              }
          }'''
              assignment = 'signingConfig = signingConfigs.getByName("release")'
          else:
              setup = '''def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          '''
              signing = '''signingConfigs {
              release {
                  keyAlias keystoreProperties['keyAlias']
                  keyPassword keystoreProperties['keyPassword']
                  storeFile file(keystoreProperties['storeFile'])
                  storePassword keystoreProperties['storePassword']
              }
          }'''
              assignment = 'signingConfig signingConfigs.release'
          if "keystorePropertiesFile" not in source:
              source = setup + source
          if "signingConfigs {" not in source:
              match = re.search(r"android\s*\{", source)
              if not match:
                  raise SystemExit("Android Gradle block not found")
              source = source[:match.end()] + "\n" + signing + source[match.end():]
          match = re.search(r"(release\s*\{)(.*?)(\n\s*\})", source, re.S)
          if not match:
              raise SystemExit("Release build type not found")
          body = match.group(2)
          if "signingConfig" not in body:
              body += "\n            " + assignment + "\n        "
          else:
              body = re.sub(r"signingConfig\s*(?:=\s*)?[^\n]+", assignment, body)
          source = source[:match.start(2)] + body + source[match.end(2):]
          gradle.write_text(source)
          PY

      - name: Build signed APK
        working-directory: /tmp/statushd
        run: >-
          flutter build apk --release
          --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: vyntra-android-release
          path: /tmp/statushd/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1
